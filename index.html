    function probe(row,col){for(let r=-1;r<=7;r++){if(row+r<0||row+r>=n)continue;
      for(let c=-1;c<=7;c++){if(col+c<0||col+c>=n)continue;
        M[row+r][col+c]=((r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4))?1:0;}}}
    probe(0,0);probe(n-7,0);probe(0,n-7);
    const pos=ALIGN[v];
    for(const r of pos)for(const c of pos){if(M[r][c]!==null)continue;
      for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
        M[r+i][c+j]=(i===-2||i===2||j===-2||j===2||(i===0&&j===0))?1:0;}
    for(let i=8;i<n-8;i++){if(M[i][6]===null)M[i][6]=i%2===0?1:0;if(M[6][i]===null)M[6][i]=i%2===0?1:0;}
    const ti=typeInfo(mask); // nível M => bits EC "00"
    for(let i=0;i<15;i++){const m=(ti>>i)&1;
      if(i<6)M[i][8]=m; else if(i<8)M[i+1][8]=m; else M[n-15+i][8]=m;}
    for(let i=0;i<15;i++){const m=(ti>>i)&1;
      if(i<8)M[8][n-i-1]=m; else if(i<9)M[8][15-i]=m; else M[8][14-i]=m;}
    M[n-8][8]=1;
    if(v>=7){const vi=verInfo(v);
      for(let i=0;i<18;i++){M[Math.floor(i/3)][i%3+n-11]=(vi>>i)&1;}
      for(let i=0;i<18;i++){M[i%3+n-11][Math.floor(i/3)]=(vi>>i)&1;}}
    let inc=-1,row=n-1,bitIdx=7,byteIdx=0;
    for(let col=n-1;col>0;col-=2){
      if(col===6)col--;
      while(true){
        for(let c=0;c<2;c++){
          if(M[row][col-c]===null){
            let dark=false;
            if(byteIdx<bytes.length)dark=((bytes[byteIdx]>>>bitIdx)&1)===1;
            if(MASKS[mask](row,col-c))dark=!dark;
            M[row][col-c]=dark?1:0;
            if(--bitIdx===-1){byteIdx++;bitIdx=7;}
          }
        }
        row+=inc;
        if(row<0||row>=n){row-=inc;inc=-inc;break;}
      }
    }
    return M;
  }
  function dataURL(text,px){
    try{
      const e=encode(text); if(!e)return null;
      const M=matrix(e.v,e.bytes,0);
      const n=M.length,q=4,scale=Math.max(3,Math.round((px||200)/(n+2*q)));
      const dim=(n+2*q)*scale;
      const cv=document.createElement('canvas');cv.width=cv.height=dim;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,dim,dim);ctx.fillStyle='#000';
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(M[r][c])ctx.fillRect((c+q)*scale,(r+q)*scale,scale,scale);
      return cv.toDataURL('image/png');
    }catch(err){ return null; }
  }
  return { dataURL };
})();

function renderQR(elId, texto, size){
  const el = document.getElementById(elId);
  if(!el) return;
  el.innerHTML = '';
  if(!texto){ el.innerHTML = '<span class="hint">Preencha a chave PIX</span>'; return; }
  const url = QRGen.dataURL(texto, (size||170)*2);
  el.innerHTML = url
    ? `<img src="${url}" style="width:${size||170}px;height:${size||170}px;image-rendering:pixelated">`
    : '<span class="hint">Não foi possível gerar o QR. Use o copia e cola.</span>';
}
function previewQR(){
  const cfg = {
    pixKey: document.getElementById('cf-pixkey')?.value.trim(),
    pixNome: document.getElementById('cf-pixnome')?.value.trim(),
    pixTipo: document.getElementById('cf-pixtipo')?.value,
    pixCidade: (document.getElementById('cf-cidade')?.value.trim()||'').split(' - ')[0],
    nomeEmpresa: DB.config?.nomeEmpresa
  };
  const payload = pixPayload(null, cfg);
  renderQR('qr-preview', payload);
  const ta = document.getElementById('pix-copia');
  if(ta) ta.value = payload || '';
}
function copiarPix(){
  const ta = document.getElementById('pix-copia');
  if(!ta || !ta.value) return;
  ta.select();
  navigator.clipboard?.writeText(ta.value).then(()=>alert('Código PIX copiado! ✔')).catch(()=>document.execCommand('copy'));
}
function qrDataURL(payload, cb){
  cb(payload ? QRGen.dataURL(payload, 400) : null);
}

  const manifest = {
    name: 'TecService — Assistência Técnica',
    short_name: 'TecService',

    display: 'standalone',
    background_color: '#16324f',

    ]

  link.href = URL.createObjectURL(blob);

  document.head.appendChild(apple);

  // captura o evento de instalação (Android/Chrome)
  window._deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window._deferredPrompt = e;
    const b = document.querySelector('[onclick="instalarApp()"]');
    if(b) b.classList.add('amber');
  });

  // Service Worker — necessário para o Chrome reconhecer como app instalável.
  // Só funciona quando hospedado em https:// (ex.: GitHub Pages). Em file:// é ignorado.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    // Remove registros antigos antes de registrar o novo — evita servir versão velha em cache
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>{ if(r.active && r.active.scriptURL.startsWith('blob:')) r.unregister(); });
    }).catch(()=>{});
    // Limpa caches antigos do app
    if(window.caches){
      caches.keys().then(nomes=>{
        nomes.forEach(n=>{ if(n.startsWith('tecservice-') && n!=='tecservice-v3') caches.delete(n); });
      }).catch(()=>{});
    }
    const swCode = `
      const CACHE='tecservice-v3';
      self.addEventListener('install', e=>{ self.skipWaiting(); });
      self.addEventListener('activate', e=>{ e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e=>{
        // A página principal SEMPRE vem da rede quando possível (evita versão velha em cache).
        // O cache serve só de reserva quando estiver offline.
        e.respondWith(
          fetch(e.request).then(res=>{
            if(e.request.method==='GET' && res.ok){
              const clone=res.clone();
              caches.open(CACHE).then(c=>c.put(e.request, clone));
            }
            return res;
          }).catch(()=> caches.match(e.request))
        );
      });`;
    const swUrl = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
    navigator.serviceWorker.register(swUrl).catch(()=>{ /* ok em file:// */ });
  }
})();

async function instalarApp(){
  if(window._deferredPrompt){
    window._deferredPrompt.prompt();
    await window._deferredPrompt.userChoice;
    window._deferredPrompt = null;
    return;
  }
  // Se está rodando de arquivo local (file://) ou dentro do Claude, o Chrome não instala
  if(!location.protocol.startsWith('http') || location.protocol==='blob:'){
    alert('⚠ Para INSTALAR como app, o sistema precisa estar publicado em um endereço https://\n\n'+
      'Abrindo o arquivo direto no computador (ou por esta janela de visualização), o Chrome não oferece a instalação — é uma regra do próprio Chrome.\n\n'+
      'SOLUÇÃO (grátis, 3 minutos):\n'+
      '1. Acesse app.netlify.com/drop\n'+
      '2. Arraste o arquivo do sistema para a página\n'+
      '3. Você recebe um link https:// — abra ele no Chrome\n'+
      '4. Aí o botão "Instalar App" vai funcionar em qualquer aparelho!\n\n'+
      'Consulte o guia "COMO-HOSPEDAR" que acompanha o sistema.');
    return;
  }
  // fallback: instruções manuais (já está em https mas o evento não disparou)
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  alert(iOS
    ? 'Para instalar no iPhone/iPad:\n\n1. Toque no botão Compartilhar (⬆ na barra do Safari)\n2. Escolha "Adicionar à Tela de Início"\n3. Toque em Adicionar'
    : 'Para instalar:\n\n• No celular (Chrome): menu ⋮ → "Instalar app" ou "Adicionar à tela inicial"\n• No computador (Chrome/Edge): ícone de instalar (⊕) na barra de endereço, ou menu ⋮ → "Instalar TecService"\n\nSe não aparecer, talvez o app já esteja instalado.');
}

/* ================= LOGIN / ACESSO ================= */
const LOGIN_KEY = 'tecservice-auth';
function tentarLogin(){
  const val = document.getElementById('login-senha').value;
  if(val === SENHA_ACESSO){
    if(document.getElementById('login-lembrar').checked){
      try{ localStorage.setItem(LOGIN_KEY, '1'); }catch(e){}
    }
    entrarNoApp();
  } else {
    const err = document.getElementById('login-erro');
    err.textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('login-senha').value = '';
    document.getElementById('login-senha').focus();
  }
}
function entrarNoApp(){
  document.getElementById('login-tela').style.display = 'none';
  iniciarApp();
}
function sair(){
  try{ localStorage.removeItem(LOGIN_KEY); }catch(e){}
  location.reload();
}

let APP_INICIADO = false;
function iniciarApp(){
  if(APP_INICIADO) return;
  APP_INICIADO = true;
  load();
}

// Se já ficou "conectado" neste aparelho, entra direto; senão mostra a tela de senha
try{
  if(localStorage.getItem(LOGIN_KEY) === '1'){
    document.getElementById('login-tela').style.display = 'none';
    iniciarApp();
  } else {
    setTimeout(()=>document.getElementById('login-senha')?.focus(), 200);
  }
}catch(e){
  setTimeout(()=>document.getElementById('login-senha')?.focus(), 200);
}
</script>
