<title>TecService — Assistência Técnica</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#eef1f4; --surface:#ffffff; --ink:#16232f; --muted:#5b6b7a;
    --navy:#16324f; --navy-2:#1f4468; --amber:#e8940a; --amber-soft:#fdf3df;
    --green:#1a7f4e; --green-soft:#e3f5eb; --red:#c23934; --red-soft:#fdeceb;
    --blue:#2563a8; --blue-soft:#e7f0fa; --purple:#6d4fa3; --purple-soft:#f0eafa;
    --gray-soft:#eceff2; --line:#dde3e9; --radius:10px;
    --mono:ui-monospace,'Cascadia Code','Roboto Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
  /* Modo celular simulado: só faz sentido em telas largas (PC) */
  @media(min-width:600px){
    body.mobile{background:#2a3642;padding:20px 0}
    body.mobile header,body.mobile nav,body.mobile main{max-width:400px;margin-left:auto;margin-right:auto}
    body.mobile header{flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px;border-radius:24px 24px 0 0;box-shadow:0 0 40px rgba(0,0,0,.4)}
    body.mobile header h1{font-size:16px}
    body.mobile .header-btns{flex-wrap:wrap}
    body.mobile .header-btns .btn{flex:1 1 auto}
    body.mobile nav{background:#fff;overflow-x:auto;box-shadow:0 0 40px rgba(0,0,0,.4)}
    body.mobile nav button{padding:12px 14px;font-size:13.5px;white-space:nowrap}
    body.mobile main{padding:14px 12px 40px;background:var(--bg);min-height:70vh;border-radius:0 0 24px 24px;box-shadow:0 0 40px rgba(0,0,0,.4);overflow-x:hidden}
    body.mobile .g4,body.mobile .g3,body.mobile .g2{grid-template-columns:1fr}
    body.mobile .modal{max-width:94%}
    body.mobile .card{overflow-x:auto}
    body.mobile table{min-width:0}
    body.mobile .spread{flex-direction:column;align-items:stretch}
    body.mobile .spread .btn,body.mobile .spread .search{width:100%}
    body.mobile .search{max-width:100%}
    body.mobile input,body.mobile select,body.mobile textarea{font-size:15px}
  }
  /* Celular real: campos e botões grandes e legíveis ao toque */
  @media(max-width:600px){
    header{flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px}
    header h1{font-size:16px}
    .header-btns{width:100%}
    .header-btns .btn{flex:1;min-width:0;text-align:center}
    nav{overflow-x:auto}
    nav button{padding:12px 14px;font-size:14px;white-space:nowrap}
    main{padding:12px 10px 60px}
    input,select,textarea{font-size:16px;padding:12px}
    label{font-size:12.5px}
    .g4,.g3,.g2{grid-template-columns:1fr}
    .modal{padding:16px}
    .btn{padding:12px 16px}
    .btn.sm{padding:9px 12px;font-size:13px}
    .card{overflow-x:auto}
    table{font-size:13px}
    th,td{padding:8px 6px;white-space:nowrap}
    .search{max-width:100%}
    .spread{flex-direction:column;align-items:stretch}
    .spread .btn,.spread .search,.spread .row{width:100%}
    .spread .row{flex-wrap:wrap}
  }
  .header-btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:0;border-color:var(--navy-2)}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}

  /* ---------- layout ---------- */
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.75}
  nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 12px}
  nav button{background:none;border:none;padding:14px 18px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
  nav button.active{color:var(--navy);border-bottom-color:var(--amber)}
  nav button:hover{color:var(--navy)}
  main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:16px;margin-bottom:14px;color:var(--navy)}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  .btn{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:7px;font-weight:600;font-size:14px}
  .btn:hover{background:var(--navy-2)}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.sec:hover{background:var(--gray-soft)}
  .btn.warn{background:var(--red)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn.amber{background:var(--amber)}
  .btn.green{background:var(--green)}
  .btn.green:hover{background:#15683f}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:hover td{background:#f7f9fb}
  .tnum{font-family:var(--mono);font-weight:600}
  .right{text-align:right}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-style:italic}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .b-aberta{background:var(--blue-soft);color:var(--blue)}
  .b-andamento{background:var(--amber-soft);color:#a36400}
  .b-peca{background:var(--purple-soft);color:var(--purple)}
  .b-concluida{background:var(--green-soft);color:var(--green)}
  .b-entregue{background:var(--gray-soft);color:var(--muted)}
  .b-desistencia{background:var(--red-soft);color:var(--red)}
  .b-cortesia{background:var(--purple-soft);color:var(--purple)}
  .b-semconserto{background:var(--red-soft);color:var(--red)}
  .b-garantia{background:var(--green-soft);color:var(--green)}
  .b-vencida{background:var(--red-soft);color:var(--red)}
  .b-baixo{background:var(--red-soft);color:var(--red)}
  .b-pago{background:var(--green-soft);color:var(--green)}
  .b-pendente{background:var(--red-soft);color:var(--red)}
  .b-parcial{background:var(--amber-soft);color:#a36400}

  .os-tag{font-family:var(--mono);font-weight:700;background:var(--navy);color:#fff;padding:2px 9px;border-radius:5px;font-size:13px;letter-spacing:.5px}

  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-top:4px solid var(--navy)}
  .stat .n{font-size:26px;font-weight:800;font-family:var(--mono)}
  .stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .stat.a{border-top-color:var(--amber)} .stat.g{border-top-color:var(--green)} .stat.r{border-top-color:var(--red)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:720px;width:100%;padding:22px;max-height:calc(100vh - 60px);overflow-y:auto}
  .modal h3{color:var(--navy);margin-bottom:16px;font-size:17px}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  .detail-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .detail-line b{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
  .peca-item{display:flex;justify-content:space-between;align-items:center;background:var(--gray-soft);padding:7px 12px;border-radius:6px;margin-top:6px;font-size:13.5px}
  .lucro{color:var(--green);font-weight:700}
  #brand-logo img{height:38px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
  .quick-box{background:var(--amber-soft);border:1px solid #f0d9a8;border-radius:8px;padding:12px;margin-top:8px}
  .autocomplete-lista{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:260px;overflow-y:auto;z-index:50;margin-top:2px}
  .autocomplete-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--gray-soft);font-size:14px}
  .autocomplete-item:last-child{border-bottom:none}
  .autocomplete-item:hover,.autocomplete-item.ativo{background:var(--blue-soft)}
  .autocomplete-item b{color:var(--navy)}
  .autocomplete-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .autocomplete-vazio{padding:12px;font-size:13px;color:var(--muted);text-align:center}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px;background:var(--gray-soft);border-radius:8px;padding:10px}
  .check-item{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer;margin:0}
  .check-item input{width:auto;accent-color:var(--navy)}
  .fotos-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .foto-thumb{position:relative;width:110px;height:110px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .foto-thumb img{width:100%;height:100%;object-fit:cover}
  .foto-tag{position:absolute;left:0;bottom:0;font-size:10.5px;font-weight:800;padding:2px 8px;color:#fff;border-radius:0 8px 0 0}
  .ft-antes{background:var(--red)} .ft-depois{background:var(--green)}
  .foto-x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px}
  .search{max-width:340px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  @media(max-width:640px){ main{padding:14px 10px 50px} .card{padding:14px} td,th{padding:8px 6px;font-size:13px} }
</style>
</head>
<body>

<div id="login-tela" style="position:fixed;inset:0;background:linear-gradient(135deg,#16324f,#1f4468);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:32px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-size:44px;margin-bottom:6px">🔧</div>
    <h1 style="font-size:20px;color:#16324f;margin-bottom:4px">TecService</h1>
    <p style="font-size:13px;color:#5b6b7a;margin-bottom:20px">Digite a senha para acessar</p>
    <input id="login-senha" type="password" placeholder="Senha" style="width:100%;padding:13px;border:1px solid #dde3e9;border-radius:8px;font-size:16px;text-align:center;margin-bottom:12px" onkeydown="if(event.key==='Enter')tentarLogin()">
    <div id="login-erro" style="color:#c23934;font-size:13px;min-height:18px;margin-bottom:10px"></div>

const SENHA_ACESSO = '10092487@*';    // senha para abrir o programa

const temClaudeStorage = typeof window.storage !== 'undefined';

/* ---- Estado da nuvem ---- */
let NUVEM = { ativa:false, ref:null, db:null, aplicandoRemoto:false, ultimoEnvio:0 };

function cloudCfg(){
  // usa sempre a config fixa embutida
  return { lojaId: LOJA_FIXA, firebase: FIREBASE_FIXO };
}
function salvarCloudCfg(cfg){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
}

// Inicia a conexão com o Firebase se houver config salva neste aparelho
async function iniciarNuvem(){
  const cfg = cloudCfg();
  if(!cfg || !cfg.firebase || !cfg.firebase.apiKey) return false;
  if(typeof firebase === 'undefined'){ console.warn('SDK Firebase não carregou'); return false; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg.firebase);
    NUVEM.db = firebase.database();
    const pasta = 'lojas/' + (cfg.lojaId || 'principal');
    NUVEM.ref = NUVEM.db.ref(pasta + '/dados');
    NUVEM.aparelhosRef = NUVEM.db.ref(pasta + '/aparelhos');
    NUVEM.ativa = true;
    NUVEM.ref.on('value', snap => {
      const val = snap.val();
      if(!val) return;
      let remoto;
      try{ remoto = JSON.parse(val); }catch(e){ return; }
      aplicarRemoto(remoto);
    }, err => { atualizarStatusNuvem('🔴 Erro de conexão'); });
    // registra este aparelho e verifica se está bloqueado
    registrarAparelho();
    atualizarStatusNuvem('🟢 Nuvem conectada');
    return true;
  }catch(e){ console.warn('Falha ao iniciar nuvem', e); atualizarStatusNuvem('🔴 Falha na nuvem'); return false; }
}

/* ================= CONTROLE DE APARELHOS ================= */
const APARELHO_KEY = 'tecservice-device-id';
function idAparelho(){
  let id = null;
  try{ id = localStorage.getItem(APARELHO_KEY); }catch(e){}
  if(!id){
    id = 'ap-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    try{ localStorage.setItem(APARELHO_KEY, id); }catch(e){}
  }
  return id;
}
function nomeAparelhoAuto(){
  const ua = navigator.userAgent || '';
  let disp = 'Aparelho';
  if(/Android/i.test(ua)) disp = 'Android';
  else if(/iPhone|iPad|iPod/i.test(ua)) disp = 'iPhone/iPad';
  else if(/Windows/i.test(ua)) disp = 'Windows (PC)';
  else if(/Mac/i.test(ua)) disp = 'Mac';
  else if(/Linux/i.test(ua)) disp = 'Linux';
  const nav = /Chrome/i.test(ua)?'Chrome':/Firefox/i.test(ua)?'Firefox':/Safari/i.test(ua)?'Safari':/Edg/i.test(ua)?'Edge':'Navegador';
  return `${disp} · ${nav}`;
}
async function registrarAparelho(){
  if(!NUVEM.aparelhosRef) return;
  const id = idAparelho();
  const ref = NUVEM.aparelhosRef.child(id);
  try{
    const snap = await ref.get();
    const atual = snap.val() || {};
    // se este aparelho foi bloqueado, sai do programa
    if(atual.bloqueado){
      alert('🚫 Este aparelho foi BLOQUEADO pelo administrador e não pode acessar o sistema.');
      try{ localStorage.removeItem(LOGIN_KEY); }catch(e){}
      location.href = 'about:blank';
      return;
    }
    let nomeGuardado = '';
    try{ nomeGuardado = localStorage.getItem('tecservice-device-nome')||''; }catch(e){}
    const dados = {
      nome: atual.nome || nomeGuardado || nomeAparelhoAuto(),
      ua: navigator.userAgent||'',
      primeiroAcesso: atual.primeiroAcesso || Date.now(),
      ultimoAcesso: Date.now(),
      bloqueado: false
    };
    await ref.update(dados);
    // heartbeat: atualiza "último acesso" a cada 2 min e vigia bloqueio
    if(NUVEM._hb) clearInterval(NUVEM._hb);
    NUVEM._hb = setInterval(()=>{
      ref.update({ ultimoAcesso: Date.now() }).catch(()=>{});
    }, 120000);
    // vigia bloqueio em tempo real: se bloquearem este aparelho, ele sai
    ref.child('bloqueado').on('value', s=>{
      if(s.val()===true){
        alert('🚫 Este aparelho foi bloqueado pelo administrador.');
        try{ localStorage.removeItem(LOGIN_KEY); }catch(e){}
        location.href = 'about:blank';
      }
    });
  }catch(e){ console.warn('Falha ao registrar aparelho', e); }
}
function menuAparelhos(){
  if(!NUVEM.aparelhosRef){ return alert('A nuvem não está conectada.'); }
  openModal(`<h3>📱 Aparelhos com acesso</h3><div id="ap-lista"><div class="empty">Carregando…</div></div>
  <div class="actions"><button class="btn sec" onclick="closeModal()">Fechar</button></div>`);
  NUVEM.aparelhosRef.get().then(snap=>{
    const obj = snap.val() || {};
    const meu = idAparelho();
    const lista = Object.entries(obj).map(([id,a])=>({id,...a})).sort((a,b)=>(b.ultimoAcesso||0)-(a.ultimoAcesso||0));
    const box = document.getElementById('ap-lista');
    if(!box) return;
    const ativos = lista.filter(a=>!a.bloqueado).length;
    box.innerHTML = `<div style="background:var(--blue-soft);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px">
      <b>${ativos}</b> aparelho(s) com acesso liberado.
    </div>` + (lista.length ? `<table><thead><tr><th>Aparelho</th><th>Último acesso</th><th></th></tr></thead><tbody>
    ${lista.map(a=>{
      const eu = a.id===meu;
      const quando = a.ultimoAcesso ? tempoRelativo(a.ultimoAcesso) : '—';
      return `<tr style="${a.bloqueado?'opacity:.5':''}">
        <td><b>${esc(a.nome||'Aparelho')}</b>${eu?' <span class="badge b-concluida">este aparelho</span>':''}${a.bloqueado?' <span class="badge b-desistencia">bloqueado</span>':''}
          <div style="font-size:11px;color:var(--muted)">1º acesso: ${a.primeiroAcesso?fdate(new Date(a.primeiroAcesso).toISOString().slice(0,10)):'—'}</div></td>
        <td style="font-size:12px">${quando}</td>
        <td class="right">
          ${eu ? '<span class="hint">—</span>' : (a.bloqueado
            ? `<button class="btn sec sm" onclick="desbloquearAparelho('${a.id}')">Desbloquear</button>`
            : `<button class="btn warn sm" onclick="bloquearAparelho('${a.id}')">Bloquear</button>`)}
          ${!eu?`<button class="btn sec sm" onclick="renomearAparelho('${a.id}','${esc(a.nome||'')}')">Renomear</button>`:`<button class="btn sec sm" onclick="renomearAparelho('${a.id}','${esc(a.nome||'')}')">Renomear</button>`}
        </td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">Nenhum aparelho registrado ainda.</div>');
  }).catch(()=>{ const box=document.getElementById('ap-lista'); if(box) box.innerHTML='<div class="empty">Não foi possível carregar.</div>'; });
}
function tempoRelativo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'agora mesmo';
  if(s<3600) return `há ${Math.floor(s/60)} min`;
  if(s<86400) return `há ${Math.floor(s/3600)} h`;
  const dias = Math.floor(s/86400);
  if(dias===1) return 'ontem';
  if(dias<30) return `há ${dias} dias`;
  return new Date(ts).toLocaleDateString('pt-BR');
}
async function bloquearAparelho(id){
  if(!confirm('Bloquear este aparelho? Ele será desconectado e não poderá mais acessar o sistema com esta senha.')) return;
  try{ await NUVEM.aparelhosRef.child(id).update({bloqueado:true}); }catch(e){}
  menuAparelhos();
}
async function desbloquearAparelho(id){
  try{ await NUVEM.aparelhosRef.child(id).update({bloqueado:false}); }catch(e){}
  menuAparelhos();
}
async function renomearAparelho(id, nomeAtual){
  const novo = prompt('Nome do aparelho (ex.: Celular do balcão, PC da oficina):', nomeAtual||'');
  if(novo===null) return;
  try{
    await NUVEM.aparelhosRef.child(id).update({nome:novo.trim()||nomeAtual});
    if(id===idAparelho()){ try{ localStorage.setItem('tecservice-device-nome', novo.trim()); }catch(e){} }
  }catch(e){}
  menuAparelhos();
}


// Aplica dados vindos da nuvem, com proteções contra apagar o que é mais novo aqui
function aplicarRemoto(remoto){
  const remT = remoto.atualizadoEm || 0;
  const locT = DB.atualizadoEm || 0;
  // ignora o eco do que ESTE aparelho acabou de enviar
  if(remT && remT === NUVEM.ultimoEnvio) return;
  // só aceita se a nuvem for ESTRITAMENTE mais nova que o local
  if(remT <= locT) return;
  NUVEM.aplicandoRemoto = true;
  DB = remoto;
  DB.servicos=DB.servicos||[]; DB.gastos=DB.gastos||[]; DB.funcionarios=DB.funcionarios||[]; DB.lembretes=DB.lembretes||[]; DB.agenda=DB.agenda||[]; DB.horarios=DB.horarios||[]; DB.creditos=DB.creditos||[];
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  render();
  atualizarStatusNuvem('🟢 Sincronizado');
  NUVEM.aplicandoRemoto = false;
}

// Calcula o tamanho aproximado dos dados e detalha o que ocupa espaço
function calcularUsoNuvem(){
  const json = JSON.stringify(DB);
  const bytesTotal = new Blob([json]).size;
  // conta o peso das fotos separadamente
  let bytesFotos = 0, qtdFotos = 0;
  (DB.ordens||[]).forEach(o=>(o.fotos||[]).forEach(ft=>{
    if(ft.img){ bytesFotos += ft.img.length; qtdFotos++; }
  }));
  // logo da empresa
  let bytesLogo = (DB.config?.logo||'').length;
  const LIMITE = 1024*1024*1024; // 1 GB do plano gratuito
  return {
    total: bytesTotal, fotos: bytesFotos, logo: bytesLogo,
    dados: Math.max(0, bytesTotal - bytesFotos - bytesLogo),
    qtdFotos, limite: LIMITE, percent: (bytesTotal/LIMITE*100)
  };
}
function fmtBytes(b){
  if(b < 1024) return b+' B';
  if(b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  if(b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+' MB';
  return (b/1024/1024/1024).toFixed(2)+' GB';
}
// Conta fotos e espaço de OS mais antigas que X meses
function fotosAntigas(meses){
  const limite = new Date(); limite.setMonth(limite.getMonth()-meses);
  const limiteISO = limite.toISOString().slice(0,10);
  let qtdOS=0, qtdFotos=0, bytes=0;
  (DB.ordens||[]).forEach(o=>{
    const ref = o.dataConclusao || o.dataEntrada || '';
    if(ref && ref < limiteISO && (o.fotos||[]).length){
      qtdOS++;
      o.fotos.forEach(ft=>{ if(ft.img){ qtdFotos++; bytes += ft.img.length; } });
    }
  });
  return { qtdOS, qtdFotos, bytes, limiteISO };
}

async function executarLimpezaFotos(){
  const meses = Number(document.getElementById('lf-meses').value);
  const r = fotosAntigas(meses);
  if(!r.qtdFotos) return alert('Não há fotos dessa idade para apagar.');
  if(!confirm(`Confirma apagar ${r.qtdFotos} foto(s) de ${r.qtdOS} OS anteriores a ${fdate(r.limiteISO)}?\n\nUm backup será baixado antes. Esta ação não pode ser desfeita (a não ser restaurando o backup).`)) return;
  // 1) backup automático antes de apagar
  exportarBackup('backup-antes-de-limpar');
  // 2) apaga as fotos das OS antigas
  const limite = r.limiteISO;
  let apagadas = 0;
  (DB.ordens||[]).forEach(o=>{
    const ref = o.dataConclusao || o.dataEntrada || '';
    if(ref && ref < limite && (o.fotos||[]).length){
      apagadas += o.fotos.length;
      o.fotos = [];
    }
  });
  await save(); 
  closeModal();
  alert(`✔ Limpeza concluída!\n\n${apagadas} foto(s) apagada(s). O backup foi baixado no seu aparelho.\n\nO espaço na nuvem será atualizado.`);
  render();
}

async function conectarNuvem(){
  const senha = document.getElementById('nv-senha').value.trim();
  const fbTxt = document.getElementById('nv-fb').value.trim();
  if(!senha) return alert('Defina a senha única da loja.');
  if(!fbTxt) return alert('Cole a configuração do Firebase.');
  let firebaseCfg;
  try{
    let s = fbTxt.replace(/^[\s\S]*?\{/, '{').replace(/\}[^}]*$/, '}');
    try{ firebaseCfg = JSON.parse(s); }
    catch(_){
      s = s.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
           .replace(/'/g, '"')
           .replace(/,(\s*[}\]])/g, '$1');
      firebaseCfg = JSON.parse(s);
    }
  }catch(e){
    return alert('Não consegui ler a configuração do Firebase. Cole o conteúdo entre { } do painel do Firebase.');
  }
  if(!firebaseCfg.databaseURL) return alert('A configuração precisa conter "databaseURL". Ative o Realtime Database no Firebase e copie a config novamente.');
  if(typeof firebase === 'undefined') return alert('O componente do Firebase não carregou. Verifique sua conexão com a internet e recarregue a página.');

  const lojaId = senha.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  salvarCloudCfg({ lojaId, firebase: firebaseCfg });

  // reinicia o app do firebase com a nova config
  try{ if(firebase.apps.length){ await firebase.app().delete(); } }catch(e){}
  NUVEM = { ativa:false, ref:null, db:null, aplicandoRemoto:false, ultimoEnvio:0 };

  try{
    firebase.initializeApp(firebaseCfg);
    NUVEM.db = firebase.database();
    NUVEM.ref = NUVEM.db.ref('lojas/' + lojaId + '/dados');
  }catch(e){
    return alert('Erro ao iniciar o Firebase:\n\n'+(e.message||e)+'\n\nConfira se a config está completa.');
  }

  // Testa leitura/escrita de verdade, capturando o erro exato do Firebase
  try{
    atualizarStatusNuvem('🟡 Testando conexão…');
    const snap = await NUVEM.ref.get();
    // conexão OK — agora liga a escuta em tempo real
    NUVEM.ativa = true;
    NUVEM.ref.on('value', snap2 => {
      const val = snap2.val();
      if(!val) return;
      let remoto; try{ remoto = JSON.parse(val); }catch(e){ return; }
      aplicarRemoto(remoto);
    }, err => atualizarStatusNuvem('🔴 Erro'));

    closeModal();
    if(!snap.exists() && (DB.ordens.length || DB.clientes.length)){
      await save();
      alert('✔ Conectado! Os dados deste aparelho foram enviados para a nuvem.\n\nUse a MESMA senha e config nos outros aparelhos.');
    } else {
      await save(); // garante que este aparelho fica alinhado
      alert('✔ Conectado à nuvem! Este aparelho está sincronizado.\n\nUse a MESMA senha e config nos outros aparelhos.');
    }
    render();
  }catch(e){
    const msg = String(e.message||e);
    NUVEM.ativa = false;
    atualizarStatusNuvem('🔴 Falha');
    if(/permission|denied|PERMISSION/i.test(msg)){
      alert('🔒 O Firebase RECUSOU o acesso (permissão negada).\n\n'+
        'Isso quase sempre é a REGRA do banco. Solução:\n\n'+
        '1. No Firebase → Realtime Database → aba "Regras"\n'+
        '2. Coloque exatamente:\n\n'+
        '{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}\n\n'+
        '3. Clique em Publicar e tente conectar de novo.\n\n'+
        '(Depois de tudo funcionar, veja a Parte 5 do guia para deixar seguro.)');
    } else if(/network|offline|unavailable|timeout/i.test(msg)){
      alert('🌐 Sem conexão com o Firebase.\n\nVerifique sua internet e se o "databaseURL" está correto:\n'+firebaseCfg.databaseURL);
    } else {
      alert('Não foi possível conectar. Erro do Firebase:\n\n'+msg+'\n\n'+
        'Verifique se o Realtime Database foi ATIVADO (Parte 2 do guia) e se a região do databaseURL está certa.');
    }
  }
}

function exportarBackup(prefixo){
  DB.atualizadoEm = Date.now();
  const empresa = (DB.config?.nomeEmpresa||'tecservice').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${prefixo||'backup'}-${empresa}-${hoje()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importarBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const dados = JSON.parse(reader.result);
        if(!dados.clientes || !dados.ordens) throw new Error('formato inválido');
        // Proteção contra sobrescrita: compara as datas de alteração
        const localT = DB.atualizadoEm || 0;
        const arqT = dados.atualizadoEm || 0;
        let aviso = `Restaurar este backup?\n\nOS atuais neste aparelho: ${DB.ordens.length}\nOS no arquivo: ${dados.ordens.length}\n\nOs dados atuais serão SUBSTITUÍDOS pelos do arquivo.`;
        if(localT > arqT && (DB.ordens.length || DB.clientes.length)){
          aviso = `⚠ ATENÇÃO: este aparelho tem alterações MAIS RECENTES que o backup!\n\n`+
            `Deste aparelho: ${new Date(localT).toLocaleString('pt-BR')} (${DB.ordens.length} OS)\n`+
            `Do arquivo:     ${arqT?new Date(arqT).toLocaleString('pt-BR'):'sem data'} (${dados.ordens.length} OS)\n\n`+
            `Restaurar vai APAGAR as alterações mais novas deste aparelho. Tem certeza?`;
        }
        if(!confirm(aviso)) return;
        DB = dados;
        DB.servicos=DB.servicos||[]; DB.gastos=DB.gastos||[]; DB.funcionarios=DB.funcionarios||[]; DB.lembretes=DB.lembretes||[]; DB.agenda=DB.agenda||[]; DB.horarios=DB.horarios||[]; DB.creditos=DB.creditos||[];
        await save(); render();
        alert('Backup restaurado com sucesso! ✔');
      }catch(e){ alert('Arquivo de backup inválido.'); }
    };
    reader.readAsText(file);
  };

// Campos técnicos (e-mail, PIX, CNPJ, números) NÃO recebem correção para não atrapalhar.
function aplicarCorretor(raiz){
  if(!raiz) return;
  const semCorretor = ['email','tel','number','url','password'];
  raiz.querySelectorAll('input, textarea').forEach(el=>{
    const tipo = (el.type||'text').toLowerCase();
    const id = (el.id||'').toLowerCase();
    const tecnico = semCorretor.includes(tipo)
      || /pix|cnpj|doc|cod|serie|senha|valor|qtd|preco|compra|venda|min|gar/.test(id);
    if(tecnico){
      el.setAttribute('spellcheck','false');
      el.setAttribute('autocorrect','off');
      el.setAttribute('autocapitalize','off');
    } else {
      el.setAttribute('spellcheck','true');
      el.setAttribute('lang','pt-BR');
      el.setAttribute('autocorrect','on');
      // nomes próprios e endereços: primeira letra de cada palavra maiúscula
      el.setAttribute('autocapitalize', el.tagName==='TEXTAREA' ? 'sentences' : 'words');
    }
  });
}

// Taxas de pagamento configuradas (com padrão sensato se ainda não configuradas)
function taxasAtuais(){
  const t = (DB.config && DB.config.taxas) || {};
  let credito = t.credito;
  if(!Array.isArray(credito) || credito.length!==12){
    // padrão: 2,69% em 1x até 8,99% em 12x, interpolado linearmente nas parcelas do meio
    const ini=2.69, fim=8.99;
    credito = Array.from({length:12}, (_,i)=> Math.round((ini + (fim-ini)*(i/11))*100)/100);
  }
  return { pixDinheiro: t.pixDinheiro ?? 0, debito: t.debito ?? 0.75, credito };
}
// Calcula a taxa (%) e o valor COM JUROS embutido (soma, não desconta) para uma forma de pagamento / nº de parcelas
// Ex.: serviço custa R$270, cliente paga em 12x → soma o juro da parcela, cliente paga mais, você recebe o valor cheio do serviço.
function calcularTaxaPagamento(valorBase, forma, parcelas){
  const TAXAS = taxasAtuais();
  valorBase = Number(valorBase)||0;
  let pct = 0;
  if(forma==='Pix' || forma==='Dinheiro') pct = TAXAS.pixDinheiro;
  else if(forma==='Cartão de débito') pct = TAXAS.debito;
  else if(forma==='Cartão de crédito'){
    const n = Math.min(12, Math.max(1, Number(parcelas)||1));
    pct = TAXAS.credito[n-1];
  } else return null; // outras formas (transferência, boleto, outro): sem taxa configurada
  const jurosValor = Math.round(valorBase*(pct/100)*100)/100;
  return { pct, jurosValor, comJuros: Math.round((valorBase+jurosValor)*100)/100 };
}

/* ================= CONSULTA DE CNPJ NA INTERNET ================= */
async function consultarCNPJ(cnpjBruto){
  const cnpj = String(cnpjBruto||'').replace(/\D/g,'');
  if(cnpj.length !== 14){ alert('Digite um CNPJ válido com 14 números.'); return null; }
  try{
    const resp = await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj);
    if(!resp.ok) throw new Error('não encontrado');
    const d = await resp.json();
    const rua = [d.logradouro, d.numero].filter(Boolean).join(', ') + (d.complemento?' - '+d.complemento:'');
    const endereco = [rua, d.bairro].filter(Boolean).join(' - ');
    return {
      nome: d.nome_fantasia || d.razao_social || '',
      razao: d.razao_social || '',
      fantasia: d.nome_fantasia || '',
      telefone: d.ddd_telefone_1 ? '('+d.ddd_telefone_1.slice(0,2)+') '+d.ddd_telefone_1.slice(2) : '',
      email: d.email || '',
      rua, bairro: d.bairro||'', cep: d.cep||'',
      endereco,
      cidade: d.municipio || '',
      estado: d.uf || ''
    };
  }catch(e){
    alert('Não foi possível buscar o CNPJ na internet.\nVerifique o número, a conexão, e se necessário preencha manualmente.');
    return null;
  }
}
function fmtCNPJ(v){
  const n = String(v).replace(/\D/g,'').slice(0,14);
  if(n.length===14) return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return v;
}

function importarClientes(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = () => {
    const file = inp.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let lista;
      try{ lista = JSON.parse(reader.result); }
      catch(e){ return alert('Arquivo inválido. Selecione o arquivo de importação de clientes (.json).'); }
      if(!Array.isArray(lista)) return alert('O arquivo não contém uma lista de clientes.');
      // evita duplicar: compara por nome (ignorando maiúsculas/espaços)
      const existentes = new Set(DB.clientes.map(c=>(c.nome||'').trim().toLowerCase()));
      let novos = 0, pulados = 0;
      lista.forEach(c=>{
        const nome = (c.nome||'').trim();
        if(!nome){ return; }
        if(existentes.has(nome.toLowerCase())){ pulados++; return; }
        DB.clientes.push({
          id: c.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
          nome, telefone:c.telefone||'', doc:c.doc||'', endereco:c.endereco||'', obs:c.obs||''
        });
        existentes.add(nome.toLowerCase());
        novos++;
      });
      await save(); render();
      alert(`Importação concluída! ✔\n\n${novos} cliente(s) adicionado(s).`+(pulados?`\n${pulados} já existiam (ignorados).`:''));
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ================= REATIVAR CLIENTES (WhatsApp) ================= */
const MSG_REATIVAR_PADRAO = `Olá, {nome}! 😊
Aqui é da {empresa}. Passando para saber como está o seu {aparelho}.
Se precisar de limpeza, formatação, manutenção ou qualquer ajuda, é só chamar! 🔧
Se não quiser mais receber nossas mensagens, é só responder SAIR.`;
const REATIVAR_OCULTAR_DIAS = 60; // não sugere quem já foi contatado nesse período

function msgReativarModelo(){ return (DB.config && DB.config.msgReativar) || MSG_REATIVAR_PADRAO; }
function contatosDB(){ DB.contatos = DB.contatos || []; return DB.contatos; }
// Normaliza o telefone para o formato do WhatsApp (55 + DDD + número). Retorna '' se inválido.
function foneWhats(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(d.startsWith('55') && d.length>=12) d = d.slice(2);
  if(d.length!==10 && d.length!==11) return '';
  return '55'+d;
}
function ultimoContatoReativar(clienteId){
  const l = contatosDB().filter(x=>x.clienteId===clienteId).map(x=>x.data).sort();
  return l.length ? l[l.length-1] : '';
}
function mesesDesde(iso){
  const d = Math.floor((new Date() - new Date(iso+'T12:00:00'))/86400000);
  const m = Math.floor(d/30.4);
  return m>=12 ? `${Math.floor(m/12)} ano(s)${m%12?' e '+(m%12)+' mês(es)':''}` : `${m} mês(es)`;
}
// Clientes sem atendimento há X meses (e sem OS em andamento / equipamento parado na loja)
function candidatosReativar(meses, mostrarContatados){
  const lim = new Date(); lim.setMonth(lim.getMonth()-meses);
  const limISO = lim.toISOString().slice(0,10);
  const corteContato = new Date(); corteContato.setDate(corteContato.getDate()-REATIVAR_OCULTAR_DIAS);
  const corteContatoISO = corteContato.toISOString().slice(0,10);
  const lista = []; let semFone = 0, jaContatados = 0;
  DB.clientes.forEach(c=>{
    if(c.naoContatar) return;
    const os = DB.ordens.filter(o=>o.clienteId===c.id);
    if(!os.length) return;
    if(os.some(o=>!['Entregue','Desistência','Não tem conserto'].includes(o.status))) return;
    const datas = os.map(o=>o.dataConclusao||o.dataEntrada).filter(Boolean).sort();
    const ult = datas[datas.length-1];
    if(!ult || ult > limISO) return;
    const ultOS = [...os].sort((a,b)=>b.num-a.num)[0];
    const fone = foneWhats(c.telefone);
    if(!fone){ semFone++; return; }
    const uc = ultimoContatoReativar(c.id);
    if(uc && uc >= corteContatoISO && !mostrarContatados){ jaContatados++; return; }
    const e = eqp(ultOS.equipId);
    const serv = (ultOS.servicos||[]).map(s=>s.nome).join(', ') || ultOS.servico || ultOS.defeito || '';
    lista.push({ c, fone, ult, uc, aparelho: e ? `${e.tipo} ${e.marca}`.trim() : '', serv });
  });
  lista.sort((a,b)=>a.ult.localeCompare(b.ult));
  return { lista, semFone, jaContatados };
}
function montarMensagemReativar(c, aparelho){
  const nome = (c.nome||'').trim().split(/\s+/)[0] || 'tudo bem';
  const empresa = nomeExibicao() || 'Assistência Técnica';
  const tel = (DB.config && DB.config.telefone) || '';
  return msgReativarModelo()
    .replace(/\{nome\}/g, nome)
    .replace(/\{empresa\}/g, empresa)
    .replace(/\{aparelho\}/g, aparelho || 'computador')
    .replace(/\{telefone\}/g, tel);
}

async function registrarContatoReativar(clienteId){
  contatosDB().push({ id:uid(), clienteId, data:hoje(), tipo:'reativacao' });
  await save(); render();
}
function enviarReativar(clienteId){
  const c = cli(clienteId); if(!c) return;
  const fone = foneWhats(c.telefone);
  if(!fone) return alert('Este cliente não tem um telefone válido cadastrado.');
  const os = DB.ordens.filter(o=>o.clienteId===clienteId).sort((a,b)=>b.num-a.num)[0];
  const e = os ? eqp(os.equipId) : null;
  const msg = montarMensagemReativar(c, e ? `${e.tipo} ${e.marca}`.trim() : '');
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`, '_blank'); // abre antes de qualquer await (evita bloqueio de pop-up)
  registrarContatoReativar(clienteId);
}
async function marcarContatado(clienteId){ await registrarContatoReativar(clienteId); }
async function naoContatarCliente(clienteId, valor){
  const c = cli(clienteId); if(!c) return;
  if(valor && !confirm(`Nunca mais sugerir ${c.nome} nesta lista? (Dá para desfazer no fim da página.)`)) return;
  c.naoContatar = valor;
  await save(); render();
}

function buscarClienteVivo(){
  const inp = document.getElementById('f-ocli-busca');
  const box = document.getElementById('cli-resultados');
  const hidden = document.getElementById('f-ocli');
  const hint = document.getElementById('f-ocli-hint');
  const q = inp.value.trim().toLowerCase();
  // ao digitar, ainda não há cliente selecionado até clicar num resultado
  hidden.value = '';
  fillEquipSelect('');

  // filtra por nome, telefone ou documento
  const soDigitos = q.replace(/\D/g,'');
  let lista = DB.clientes.filter(c=>{
    const nome = (c.nome||'').toLowerCase();
    const tel = (c.telefone||'').replace(/\D/g,'');
    const doc = (c.doc||'').replace(/\D/g,'');
    return !q || nome.includes(q) || (soDigitos && (tel.includes(soDigitos) || doc.includes(soDigitos)));
  });
  // se o texto for exatamente o nome de um cliente, já seleciona
  const exato = DB.clientes.find(c=>(c.nome||'').trim().toLowerCase()===q);
  if(exato){
    hidden.value = exato.id;
    fillEquipSelect(exato.id);
    if(hint) hint.textContent = exato.telefone ? '📞 '+exato.telefone : '';
    box.style.display='none';
    atualizarPermutaCredito('f');
    return;
  }
  if(hint) hint.textContent = '';

  lista = lista.slice(0, 8); // mostra no máximo 8 resultados
  if(!q){
    box.style.display='none';
    return;
  }
  if(!lista.length){
    box.innerHTML = `<div class="autocomplete-vazio">Nenhum cliente encontrado.<br>Use "+ Novo" para cadastrar.</div>`;
    box.style.display='block';
    return;
  }
  box.innerHTML = lista.map(c=>{
    const sub = [c.telefone, c.doc].filter(Boolean).join(' · ');
    return `<div class="autocomplete-item" onclick="selecionarCliente('${c.id}')">
      <b>${esc(c.nome)}</b>${sub?`<div class="sub">${esc(sub)}</div>`:''}
    </div>`;
  }).join('');
  box.style.display='block';
}
function selecionarCliente(id){
  const c = cli(id);
  if(!c) return;
  document.getElementById('f-ocli-busca').value = c.nome;
  document.getElementById('f-ocli').value = c.id;
  document.getElementById('cli-resultados').style.display='none';
  const hint = document.getElementById('f-ocli-hint');
  if(hint) hint.textContent = c.telefone ? '📞 '+c.telefone : '';
  fillEquipSelect(c.id);
  atualizarPermutaCredito('f');
}

function abrirPesquisaClientesOS(){
  let win = document.getElementById('janela-clientes');
  if(!win){
    win = document.createElement('div');
    win.id = 'janela-clientes';
    win.style.cssText = 'position:fixed;inset:0;background:rgba(10,20,30,.6);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto';

      <div class="actions"><button class="btn sec" type="button" onclick="fecharJanelaClientes()">Fechar</button></div>
    </div>`;
    document.body.appendChild(win);
    win.addEventListener('click', e=>{ if(e.target===win) fecharJanelaClientes(); });
  }

  const busca = document.getElementById('jc-busca');
  if(busca) busca.value = '';

function filtrarJanelaClientes(){
  const q = (document.getElementById('jc-busca')?.value||'').toLowerCase().trim();
  const soDig = q.replace(/\D/g,'');
  const lista = DB.clientes.filter(c=>{
    if(!q) return true;
    const nome = (c.nome||'').toLowerCase();
    const tel = (c.telefone||'').replace(/\D/g,'');
    const doc = (c.doc||'').replace(/\D/g,'');
    return nome.includes(q) || (soDig && (tel.includes(soDig) || doc.includes(soDig)));
  });
  renderJanelaClientes(lista);
}
function renderJanelaClientes(lista){
  const box = document.getElementById('jc-lista');
  if(!box) return;
  const ordenada = [...lista].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  box.innerHTML = ordenada.length ? ordenada.map(c=>{
    const sub = [c.telefone, c.doc].filter(Boolean).join(' · ');
    return `<div class="autocomplete-item" style="border-radius:8px;margin-bottom:4px" onclick="selecionarClienteJanela('${c.id}')">
      <b>${esc(c.nome)}</b>${sub?`<div class="sub">${esc(sub)}</div>`:''}
    </div>`;
  }).join('') : '<div class="autocomplete-vazio">Nenhum cliente encontrado.<br>Use "+ Novo" para cadastrar.</div>';
}

function addFotoOS(tipo){
  if((window._fotosTmp||[]).length >= 6) return alert('Máximo de 6 fotos por OS.');
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // reduz para no máx. 640px no maior lado, JPEG comprimido
        const max = 640;
        const escala = Math.min(1, max/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*escala);
        cv.height = Math.round(img.height*escala);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        window._fotosTmp.push({ tipo, img: cv.toDataURL('image/jpeg',0.6), data: hoje() });
        renderFotos();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function addPeca(){
  const pid = document.getElementById('f-opeca').value;

  if(!pid) return;
  const p = prod(pid);
  const ex = window._pecasTmp.find(x=>x.prodId===pid);
  if(ex) ex.qtd += q; else window._pecasTmp.push({prodId:pid, nome:p.nome, qtd:q, valor:Number(p.venda)});
  renderPecas();
}
function rmPeca(i){ window._pecasTmp.splice(i,1); renderPecas(); }
function renderPecas(){
  const el = document.getElementById('pecas-list');
  el.innerHTML = window._pecasTmp.map((p,i)=>`
    <div class="peca-item"><span>${esc(p.nome)} × ${p.qtd}</span>
    <span>${fmt(p.valor*p.qtd)} <button class="btn warn sm" onclick="rmPeca(${i})">✕</button></span></div>`).join('');
  calcTotalOS();
}
// calcula o desconto e o total já com desconto, a partir do subtotal
function calcDescontoOS(subtotal){
  const val = Number(document.getElementById('f-odesc')?.value)||0;
  const tipo = document.getElementById('f-odesctipo')?.value || 'reais';
  let desc = tipo==='percent' ? subtotal*(val/100) : val;
  if(desc < 0) desc = 0;
  if(desc > subtotal) desc = subtotal; // nunca deixa o total negativo
  return { desconto:desc, tipo, valorInformado:val, total: subtotal - desc };
}
function togglePagamentoOS(){
  const st = document.getElementById('f-ostatus')?.value;
  const semPagamento = (st === 'Não tem conserto'); // só "Não tem conserto" fica sem pagamento
  const boxPag = document.getElementById('box-pagamento');
  const boxDes = document.getElementById('box-desistencia');
  if(boxPag) boxPag.style.display = semPagamento ? 'none' : '';
  if(boxDes){
    boxDes.style.display = semPagamento ? '' : 'none';
    const txt = boxDes.querySelector('div');
    if(txt) txt.innerHTML = '🚫 OS marcada como <b>Não tem conserto</b> — não há pagamento a registrar. O histórico da OS fica salvo normalmente.';
  }
  // Desistência: reaproveita o campo "Mão de obra" como "Valor do orçamento (taxa de análise)",
  // preenchendo automaticamente com o valor do Termo de Entrada — mas o valor continua editável.
  const labelMao = document.getElementById('f-omao-label');
  const campoMao = document.getElementById('f-omao');
  if(st==='Desistência'){
    if(labelMao) labelMao.textContent = 'Valor do orçamento (taxa de análise) R$';
    if(campoMao && !campoMao.value){ campoMao.value = valorOrcamentoConfigurado().toFixed(2); }
  } else if(labelMao){
    labelMao.textContent = 'Mão de obra (R$)';
  }
  calcTotalOS();
}
function atualizarTaxaOS(){
  const forma = document.getElementById('f-oforma')?.value;
  const parcBox = document.getElementById('f-oparc-box');
  const info = document.getElementById('f-otaxa-info');
  if(!info) return;
  const ehCredito = forma==='Cartão de crédito';
  if(parcBox) parcBox.style.display = ehCredito ? '' : 'none';
  const valor = Number(document.getElementById('f-opago')?.value)||0;
  const parcelas = ehCredito ? Number(document.getElementById('f-oparc')?.value)||1 : null;
  const r = calcularTaxaPagamento(valor, forma, parcelas);
  if(!r || valor<=0 || r.pct<=0){ info.innerHTML=''; return; }
  info.innerHTML = `<div style="background:var(--amber-soft);border-radius:8px;padding:8px 10px">
    Juros ${forma}${ehCredito?` ${parcelas}x`:''}: <b>${r.pct.toFixed(2)}%</b> (+ ${fmt(r.jurosValor)}) ·
    Cobrar do cliente: <b style="color:var(--red)">${fmt(r.comJuros)}</b>
    <button class="btn amber sm" type="button" style="margin-left:8px" onclick="document.getElementById('f-opago').value='${r.comJuros}';calcTotalOS();atualizarTaxaOS()">Aplicar</button>
    <div class="hint">O juro é somado ao valor — o cliente paga a mais para cobrir a taxa da maquininha.</div>
  </div>`;
}
function calcTotalOS(){
  const mao = Number(document.getElementById('f-omao')?.value)||0;
  const pecas = window._pecasTmp.reduce((s,p)=>s+p.valor*p.qtd,0);
  const servs = (window._servTmp||[]).reduce((s,x)=>s+x.valor,0);
  const subtotal = mao+pecas+servs;
  const d = calcDescontoOS(subtotal);
  const total = d.total;
  const sub = document.getElementById('os-subtotal');
  if(sub) sub.textContent = fmt(subtotal);
  const t = document.getElementById('os-total');
  if(t) t.textContent = fmt(total);
  const info = document.getElementById('os-desc-info');
  if(info) info.textContent = d.desconto>0 ? `− ${fmt(d.desconto)} de desconto${d.tipo==='percent'?` (${d.valorInformado}%)`:''}` : '';
  const pago = Number(document.getElementById('f-opago')?.value)||0;
  const prev = document.getElementById('pag-status-preview');
  if(prev){
    const fake = {valorTotal:total, valorPago:pago};
    prev.innerHTML = pagBadge(fake) + (pagStatus(fake)==='Parcial'?` <span class="hint">faltam ${fmt(total-pago)}</span>`:'');
  }
}
function marcarPagoForm(){
  const mao = Number(document.getElementById('f-omao')?.value)||0;

  const servs = (window._servTmp||[]).reduce((s,x)=>s+x.valor,0);
  const d = calcDescontoOS(mao+pecas+servs);
  document.getElementById('f-opago').value = d.total.toFixed(2);
  const dp = document.getElementById('f-odatapag');
  if(!dp.value) dp.value = hoje();
  calcTotalOS();
}
async function saveOS(id){
  const defeito = f('f-odef');
  const equipId = f('f-oeq');
  const clienteId = f('f-ocli');
  if(!clienteId){
    const digitado = document.getElementById('f-ocli-busca')?.value.trim();
    return alert(digitado
      ? `Cliente "${digitado}" não está cadastrado. Escolha um cliente da lista ou use "+ Novo" para cadastrá-lo.`
      : 'Selecione o cliente da OS.');
  }
  if(!defeito) return alert('Descreva o defeito relatado.');
  if(!equipId) return alert('Selecione ou cadastre um equipamento para este cliente.');
  const voltagem = f('f-ovolt');
  if(!voltagem) return alert('⚡ Informe a VOLTAGEM do equipamento (110V, 220V ou Bivolt). Campo obrigatório.');
  const status = f('f-ostatus');
  const atendente = f('f-oatend');
  const tecnico = f('f-otec');
  if(!atendente) return alert('Informe o nome do atendente que recebeu o equipamento.');
  if((status==='Concluída'||status==='Entregue') && !tecnico)
    return alert('Para concluir ou entregar a OS, informe o nome do técnico responsável.');
  let dataConclusao = f('f-oconc');
  if((status==='Concluída'||status==='Entregue') && !dataConclusao) dataConclusao = hoje();
  const mao = Number(f('f-omao'))||0;
  const pecasTotal = window._pecasTmp.reduce((s,p)=>s+p.valor*p.qtd,0);
  const servsTotal = (window._servTmp||[]).reduce((s,x)=>s+x.valor,0);
  const subtotal = mao + pecasTotal + servsTotal;
  const d = calcDescontoOS(subtotal);
  const data = {
    clienteId:f('f-ocli'), equipId, defeito, voltagem, servico:f('f-oserv'),
    dataEntrada:f('f-oent')||hoje(), status, dataConclusao,
    atendente, tecnico,
    checklist: checklistItens().filter((item,i)=>document.getElementById('chk-'+i)?.checked),
    checklistObs: f('f-ochkobs'),
    fotos: JSON.parse(JSON.stringify(window._fotosTmp||[])),
    garantiaDias:Number(f('f-ogar'))||0, maoDeObra:mao,
    valorPago:Number(f('f-opago'))||0, formaPag:f('f-oforma'), dataPag:f('f-odatapag'),
    parcelas: f('f-oforma')==='Cartão de crédito' ? Number(document.getElementById('f-oparc')?.value)||1 : null,
    permutaDesc: f('f-oforma')==='Permuta' ? f('f-permutadesc') : (id ? (DB.ordens.find(x=>x.id===id)?.permutaDesc||'') : ''),
    pecas: JSON.parse(JSON.stringify(window._pecasTmp)),
    servicos: JSON.parse(JSON.stringify(window._servTmp||[])),
    desconto: d.valorInformado, descontoTipo: d.tipo,
    descontoValor: d.desconto, subtotal,
    valorTotal: d.total
  };
  // Não tem conserto: não há pagamento — zera os campos de pagamento
  const semPagamento = (status==='Não tem conserto');
  if(semPagamento){
    data.valorPago = 0; data.formaPag = '—'; data.dataPag = '';
  }
  // Cortesia: serviço oferecido de graça — quita a OS mas não conta como receita
  if(data.formaPag==='Cortesia'){
    data.valorPago = data.valorTotal;
    data.dataPag = data.dataPag || hoje();
  }
  // baixa de estoque: diferença entre peças antigas e novas
  const antigas = id ? (DB.ordens.find(x=>x.id===id).pecas||[]) : [];
  const delta = {};
  antigas.forEach(p=>delta[p.prodId]=(delta[p.prodId]||0)+p.qtd);   // devolve
  data.pecas.forEach(p=>delta[p.prodId]=(delta[p.prodId]||0)-p.qtd); // retira
  for(const pid in delta){
    const p = prod(pid);
    if(p) p.qtd = Math.max(0, Number(p.qtd)+delta[pid]);
  }
  // detecta se houve NOVO pagamento (parcial ou total) ao salvar pela ficha da OS
  const pagoAntes = id ? Number((DB.ordens.find(x=>x.id===id)||{}).valorPago||0) : 0;
  const pagoAgora = (semPagamento || data.formaPag==='Cortesia') ? 0 : (Number(f('f-opago'))||0);
  const novoValor = pagoAgora - pagoAntes;

  if(id){ Object.assign(DB.ordens.find(x=>x.id===id), data); }
  else { DB.ordens.push({id:uid(), num:DB.seqOS++, ...data}); }
  const osAtual = id ? DB.ordens.find(x=>x.id===id) : DB.ordens[DB.ordens.length-1];
  const ehNova = !id;

  // Abatimento automático: se o cliente tem saldo de crédito, desconta do que falta pagar nesta OS
  osAtual._creditoAutoAplicado = 0;
  if(!semPagamento && Number(osAtual.valorTotal)>0){
    const saldoDevedor = Math.max(0, Number(osAtual.valorTotal) - Number(osAtual.valorPago||0));
    const saldoCredDisp = saldoCreditoCliente(osAtual.clienteId);
    if(saldoDevedor>0 && saldoCredDisp>0){
      const aplicar = Math.round(Math.min(saldoDevedor, saldoCredDisp)*100)/100;
      DB.creditos = DB.creditos||[];
      DB.creditos.push({ id:uid(), clienteId:osAtual.clienteId, valor:aplicar,
        motivo:`Abatimento automático em ${osNum(osAtual.num)}`, data:hoje(), tipo:'uso', osId:osAtual.id, auto:true });
      osAtual.valorPago = Math.round((Number(osAtual.valorPago||0)+aplicar)*100)/100;
      osAtual._creditoAutoAplicado = aplicar;
    }
  }

  // agenda lembretes de retorno (ex.: limpeza interna a cada 6 meses)
  gerarLembretesRetorno(osAtual);
  await save(); closeModal(); render();

  if(osAtual._creditoAutoAplicado>0){
    const saldoRestante = saldoCreditoCliente(osAtual.clienteId);
    alert(`💳 Abatimento automático aplicado!\n\n${fmt(osAtual._creditoAutoAplicado)} descontados do crédito do cliente.\nSaldo de crédito restante: ${fmt(saldoRestante)}`);
  }

  // OS nova: oferece imprimir o Comprovante de Entrada na hora
  if(ehNova){
    if(confirm(`OS ${osNum(osAtual.num)} criada! ✔\n\nDeseja imprimir o Comprovante de Entrada para o cliente?`)){
      imprimirOS(osAtual.id, 'entrada');
    }
  }

  // se registrou um pagamento novo (parcial ou completo), pergunta sobre o comprovante
  if(novoValor > 0){
    osAtual._ultimoValorPago = novoValor;
    if(confirm(`Pagamento de ${fmt(novoValor)} registrado! ✔\n\nDeseja imprimir o comprovante de pagamento?`)){
      imprimirOS(osAtual.id, 'comprovante');
    }
  }
}
// Cria lembrete de retorno para serviços recorrentes ao concluir/entregar a OS
function gerarLembretesRetorno(o){
  if(!o || (o.status!=='Concluída' && o.status!=='Entregue')) return;
  DB.lembretes = DB.lembretes || [];
  DB.agenda = DB.agenda || [];
  DB.horarios = DB.horarios || [];
  DB.creditos = DB.creditos || [];
  (o.servicos||[]).forEach(s=>{
    const cat = serv(s.servId); // serviço no catálogo (pode ter sido apagado)
    // meses de retorno: do catálogo, ou 6 meses se o nome mencionar "limpeza"
    let meses = cat && Number(cat.retornoMeses) ? Number(cat.retornoMeses) : 0;
    if(!meses && /limpeza/i.test(s.nome||'')) meses = 6;
    if(!meses) return;
    // evita duplicar lembrete para a mesma OS + mesmo serviço
    const jaTem = DB.lembretes.some(l=>l.osId===o.id && l.servico===s.nome && !l.concluido);
    if(jaTem) return;
    const base = o.dataConclusao || hoje();
    const dt = new Date(base+'T12:00:00');
    dt.setMonth(dt.getMonth() + meses);
    DB.lembretes.push({
      id: uid(), osId:o.id, clienteId:o.clienteId, equipId:o.equipId,
      servico: s.nome, data: dt.toISOString().slice(0,10),
      criadoEm: hoje(), concluido:false
    });
  });
}

  if(Number(o.descontoValor)>0){
    msg += `Subtotal: ${fmt(o.subtotal||(o.valorTotal+o.descontoValor))}\n`;
    msg += `Desconto${o.descontoTipo==='percent'?` (${o.desconto}%)`:''}: − ${fmt(o.descontoValor)}\n`;
  }
  msg += `*TOTAL: ${fmt(o.valorTotal)}*\n`;
  if(Number(o.valorPago)>0){
    msg += `Já pago: ${fmt(o.valorPago)}\n`;
    msg += `*Falta pagar: ${fmt(saldo)}*\n`;
  } else {
    const opcoes = textoOpcoesPagamento(o.valorTotal);
    if(opcoes) msg += `\n${opcoes}\n`;
  }

  const valorPix = saldo>0 ? saldo : Number(o.valorTotal);
  const payload = cf.pixKey ? pixPayload(valorPix) : '';
  if(payload){
    msg += `\n💠 *Pague com PIX* — vou enviar o código na próxima mensagem, é só tocar e copiar. 👇\n`;
    msg += `Recebedor: ${cf.pixNome||empresa}`;
    if(cf.pixBanco) msg += ` (${cf.pixBanco})`;
  }
  msg += `\n\n${empresa}`;
  if(cf.telefone) msg += `\n📞 ${cf.telefone}`;

  // número do cliente (WhatsApp exige DDI+DDD+numero, só dígitos)
  let numero = String(c?.telefone||'').replace(/\D/g,'');
  if(numero && !numero.startsWith('55')) numero = '55' + numero;

  if(!numero){
    if(!confirm('Este cliente não tem telefone cadastrado.\n\nAbrir o WhatsApp para você escolher o contato manualmente?')) return;
  }

  const base = numero ? `https://wa.me/${numero}` : `https://wa.me/`;
  // 1ª mensagem: o orçamento
  window.open(`${base}?text=${encodeURIComponent(msg)}`, '_blank');

  // 2ª mensagem: só o código PIX (fácil de copiar), enviada logo em seguida
  if(payload){
    openModal(`<h3>💬 Orçamento enviado!</h3>
    <p style="font-size:14px;margin-bottom:12px">A mensagem do orçamento foi aberta no WhatsApp. Agora envie o <b>código PIX numa mensagem separada</b>, para o cliente copiar com um toque:</p>

      <button class="btn sec" onclick="navigator.clipboard?.writeText('${payload}').then(()=>alert('Código PIX copiado!'))">📋 Copiar código</button>
      <button class="btn" style="background:#25d366" onclick="window.open('${base}?text=${encodeURIComponent(payload)}','_blank')">💬 Enviar código PIX no WhatsApp</button>
    </div>
    <div class="actions"><button class="btn sec" onclick="closeModal()">Fechar</button></div>`);
  }
}

function atualizarTaxaRP(){
  const forma = document.getElementById('rp-forma')?.value;
  const parcBox = document.getElementById('rp-parc-box');
  const info = document.getElementById('rp-taxa-info');
  if(!info) return;
  const ehCredito = forma==='Cartão de crédito';
  if(parcBox) parcBox.style.display = ehCredito ? '' : 'none';
  const valor = Number(document.getElementById('rp-valor')?.value)||0;
  const parcelas = ehCredito ? Number(document.getElementById('rp-parc')?.value)||1 : null;
  const r = calcularTaxaPagamento(valor, forma, parcelas);
  if(!r || valor<=0 || r.pct<=0){ info.innerHTML=''; return; }
  info.innerHTML = `<div style="background:var(--amber-soft);border-radius:8px;padding:8px 10px">
    Juros ${forma}${ehCredito?` ${parcelas}x`:''}: <b>${r.pct.toFixed(2)}%</b> (+ ${fmt(r.jurosValor)}) ·
    Cobrar do cliente: <b style="color:var(--red)">${fmt(r.comJuros)}</b>
    <button class="btn amber sm" type="button" style="margin-left:8px" onclick="document.getElementById('rp-valor').value='${r.comJuros}';atualizaQRPag();atualizarTaxaRP()">Aplicar</button>
    <div class="hint">O juro é somado — não descontado.</div>
  </div>`;
}
function atualizaQRPag(){
  const v = Number(document.getElementById('rp-valor')?.value)||0;
  const payload = pixPayload(v>0?v:null);
  renderQR('rp-qr', payload, 150);
  const ta = document.getElementById('rp-pix-copia');
  if(ta) ta.value = payload||'';
}
function copiarPixPag(){
  const ta = document.getElementById('rp-pix-copia');
  if(!ta || !ta.value) return;
  ta.select();
  navigator.clipboard?.writeText(ta.value).then(()=>alert('Código PIX copiado! ✔')).catch(()=>document.execCommand('copy'));
}
async function confirmarPagamento(id){
  const o = DB.ordens.find(x=>x.id===id);
  const v = Number(document.getElementById('rp-valor').value)||0;
  if(v<=0) return alert('Informe o valor recebido.');
  const forma = document.getElementById('rp-forma').value;

  // Crédito do cliente: valida saldo disponível e debita ao confirmar
  if(forma==='Crédito do cliente'){
    const saldo = saldoCreditoCliente(o.clienteId);
    if(v > saldo) return alert(`O cliente só tem ${fmt(saldo)} de crédito disponível. Ajuste o valor ou escolha outra forma de pagamento.`);
    DB.creditos = DB.creditos || [];
    DB.creditos.push({ id:uid(), clienteId:o.clienteId, valor:v, motivo:`Uso em ${osNum(o.num)}`, data:hoje(), tipo:'uso', osId:o.id });
  }
  // Permuta: guarda a descrição do que foi trocado
  if(forma==='Permuta'){
    const desc = f('rp-permutadesc');
    if(!desc) return alert('Descreva o que foi trocado na permuta.');
    o.permutaDesc = desc;
  }

  o.valorPago = Number(o.valorPago||0) + v;
  o.formaPag = forma;
  o.parcelas = o.formaPag==='Cartão de crédito' ? Number(document.getElementById('rp-parc')?.value)||1 : null;
  o.dataPag = hoje();
  o._ultimoValorPago = v; // guarda o valor deste recebimento para o comprovante
  await save(); render();
  // pergunta se deseja imprimir o comprovante de pagamento
  if(confirm(`Pagamento de ${fmt(v)} registrado! ✔\n\nDeseja imprimir o comprovante de pagamento?`)){
    imprimirOS(id, 'comprovante');
  } else {
    verOS(id);
  }
}
async function delOS(id){
  if(!confirm('Excluir esta OS? As peças usadas voltam ao estoque.')) return;
  const o = DB.ordens.find(x=>x.id===id);
  (o.pecas||[]).forEach(p=>{ const pr=prod(p.prodId); if(pr) pr.qtd=Number(pr.qtd)+p.qtd; });
  DB.ordens = DB.ordens.filter(x=>x.id!==id);
  await save(); closeModal(); render();
}
function imprimirOS(id, modo){
  const o = DB.ordens.find(x=>x.id===id);

  // QR do PIX só no recibo de saída, e apenas se houver saldo a pagar
  const payload = (modo==='saida' && DB.config?.pixKey && saldo>0) ? pixPayload(saldo) : '';
  qrDataURL(payload, qrImg => abrirImpressao(o, qrImg, modo));
}

      var imgs = Array.prototype.slice.call(document.images);
      var pendentes = imgs.filter(function(im){ return !im.complete; }).length;
      if(pendentes === 0){
        // já estão prontas — imprime no próximo quadro
        requestAnimationFrame(function(){ setTimeout(imprimir, 60); });
      } else {
        var feito = false;
        function tenta(){
          if(feito) return;
          if(imgs.every(function(im){ return im.complete; })){ feito = true; setTimeout(imprimir, 60); }
        }
        imgs.forEach(function(im){ im.addEventListener('load', tenta); im.addEventListener('error', tenta); });

function periodoDatas(p){
  const h = new Date(); h.setHours(12,0,0,0);
  const iso = d => d.toISOString().slice(0,10);
  if(p==='hoje') return [iso(h), iso(h)];
  if(p==='mes'){ const i=new Date(h.getFullYear(),h.getMonth(),1); return [iso(i), iso(h)]; }
  if(p==='ano'){ const i=new Date(h.getFullYear(),0,1); return [iso(i), iso(h)]; }
  return [null,null]; // tudo
}
function receitasOS(){
  // cada OS com valor pago vira uma receita na data do pagamento (ou conclusão/entrada)
  // Cortesia não gera receita (serviço oferecido de graça, sem custo ao cliente)
  return DB.ordens.filter(o=>Number(o.valorPago||0)>0 && o.formaPag!=='Cortesia')
    .map(o=>({ data: o.dataPag||o.dataConclusao||o.dataEntrada, valor: Number(o.valorPago),
      desc: osNum(o.num)+' — '+(cli(o.clienteId)?.nome||''), osId:o.id }));
}
function diasAte(dataISO){
  if(!dataISO) return null;
  const alvo = new Date(dataISO+'T12:00:00');
  const hj = new Date(); hj.setHours(12,0,0,0);
  return Math.round((alvo - hj)/86400000);
}
function contasAPagar(){
  // contas agendadas ainda não pagas, ordenadas por vencimento
  return (DB.gastos||[]).filter(g=>g.pago===false && g.vencimento)
    .sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
}

function toggleModoParcela(){

function addMesesISO(dataISO, meses){
  const d = new Date(dataISO+'T12:00:00');
  d.setMonth(d.getMonth()+meses);
  return d.toISOString().slice(0,10);
}
function previewParcelas(){
  const n = Math.max(2, Number(document.getElementById('fg-nparc').value)||2);
  const total = Number(f('fg-valor'))||0;
  const venc1 = document.getElementById('fg-venc1').value;
  const box = document.getElementById('fg-preview-parc');
  if(!total){ box.innerHTML='<span class="hint">Informe o valor da conta acima.</span>'; return; }
  if(!venc1){ box.innerHTML='<span class="hint">Informe a data do 1º vencimento.</span>'; return; }
  const valorParcela = Math.floor((total/n)*100)/100;
  const resto = Math.round((total - valorParcela*n)*100)/100;
  let html = `<b>${n}x</b> — `;
  const linhas = [];
  for(let i=0;i<n;i++){
    const v = i===n-1 ? valorParcela+resto : valorParcela; // ajusta centavos na última
    linhas.push(`${i+1}ª: ${fmt(v)} em ${fdate(addMesesISO(venc1,i))}`);
  }
  box.innerHTML = html + '<br>' + linhas.join('<br>');
}
function addParcelaCustom(){
  window._parcCustom = window._parcCustom||[];
  window._parcCustom.push({valor:'',venc:''});
  renderParcelasCustom();
}
function rmParcelaCustom(i){
  window._parcCustom.splice(i,1);

function renderParcelasCustom(){
  const el = document.getElementById('fg-custom-list');
  el.innerHTML = (window._parcCustom||[]).map((p,i)=>`

      <button class="btn warn sm" type="button" onclick="rmParcelaCustom(${i})">✕</button>
    </div>`).join('');

function somaParcelasCustom(){
  const total = Number(f('fg-valor'))||0;
  const soma = (window._parcCustom||[]).reduce((s,p)=>s+(Number(p.valor)||0),0);
  const el = document.getElementById('fg-custom-soma');
  const dif = Math.round((total-soma)*100)/100;
  el.innerHTML = `Soma das partes: <b>${fmt(soma)}</b> de ${fmt(total)} ` +
    (Math.abs(dif)<0.01 ? '<span style="color:var(--green)">✔ confere</span>' : `<span style="color:var(--red)">(falta ${fmt(dif)})</span>`);
}
function toggleVencimento(){

  document.getElementById('fg-box-pago').style.display = pago ? '' : 'none';

async function saveGasto(id){
  const desc = f('fg-desc');
  const valor = Number(f('fg-valor'))||0;
  if(!desc) return alert('Descreva o gasto.');
  if(valor<=0) return alert('Informe o valor.');
  const pago = document.getElementById('fg-pago').checked;
  const cat = f('fg-cat');

  // Pagamento já feito → um lançamento simples
  if(pago){
    const data = { desc, valor, cat, pago:true, data:f('fg-data')||hoje(), vencimento:'' };
    DB.gastos = DB.gastos || [];
    if(id){ Object.assign(DB.gastos.find(x=>x.id===id), data); }
    else { DB.gastos.push({id:uid(), ...data}); }
    await save(); closeModal(); render(); return;
  }

  // A pagar → verifica o modo (único, parcelado ou custom)
  const modo = document.getElementById('fg-modo').value;

  if(modo==='unico'){
    const venc = f('fg-venc');
    if(!venc) return alert('Informe a data de vencimento.');
    const data = { desc, valor, cat, pago:false, vencimento:venc, data:'' };
    DB.gastos = DB.gastos || [];
    if(id){ Object.assign(DB.gastos.find(x=>x.id===id), data); }
    else { DB.gastos.push({id:uid(), ...data}); }
    await save(); closeModal(); render(); return;
  }

  // A partir daqui são vários lançamentos (parcelas) — não faz sentido "editar" um em vários
  let parcelas = [];
  if(modo==='parcelado'){
    const n = Math.max(2, Number(document.getElementById('fg-nparc').value)||2);
    const venc1 = document.getElementById('fg-venc1').value;
    if(!venc1) return alert('Informe a data do 1º vencimento.');
    const valorParcela = Math.floor((valor/n)*100)/100;
    const resto = Math.round((valor - valorParcela*n)*100)/100;
    for(let i=0;i<n;i++){
      const v = i===n-1 ? valorParcela+resto : valorParcela;
      parcelas.push({ valor:v, venc:addMesesISO(venc1,i), rotulo:`${i+1}/${n}` });
    }
  } else { // custom
    const lista = (window._parcCustom||[]).filter(p=>Number(p.valor)>0 && p.venc);
    if(lista.length<2) return alert('Adicione pelo menos 2 partes com valor e vencimento.');
    const soma = lista.reduce((s,p)=>s+Number(p.valor),0);
    if(Math.abs(soma-valor)>=0.01) return alert(`A soma das partes (${fmt(soma)}) precisa ser igual ao valor da conta (${fmt(valor)}).`);
    parcelas = lista.map((p,i)=>({ valor:Number(p.valor), venc:p.venc, rotulo:`${i+1}/${lista.length}` }));
  }

  // cria um gasto "a pagar" para cada parcela
  DB.gastos = DB.gastos || [];
  const grupoId = uid();
  parcelas.forEach(p=>{
    DB.gastos.push({ id:uid(), desc:`${desc} (parcela ${p.rotulo})`, valor:p.valor, cat, pago:false, vencimento:p.venc, data:'', grupo:grupoId });
  });
  window._parcCustom = [];
  await save(); closeModal(); render();
  alert(`✔ Conta dividida em ${parcelas.length} parcelas!`);
}
async function marcarGastoPago(id){
  const g = DB.gastos.find(x=>x.id===id);
  if(!g) return;
  g.pago = true; g.data = hoje();
  await save(); render();
}
async function delGasto(id){
  if(!confirm('Excluir este gasto?')) return;
  DB.gastos = DB.gastos.filter(g=>g.id!==id);
  await save(); render();
}

function secHorarios(){
  const hoje0 = hoje();
  const proximos = (DB.horarios||[]).filter(h=>!h.concluido && !h.naoCompareceu).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const passados = (DB.horarios||[]).filter(h=>h.concluido || h.naoCompareceu).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora)).slice(0,20);
  const fmtDH = h => `${fdate(h.data)} às ${h.hora}`;
  const linha = h => {
    const dt = new Date(h.data+'T'+h.hora);
    const mins = Math.round((dt - new Date())/60000);
    let etiqueta = '';
    if(!h.concluido && !h.naoCompareceu){
      if(mins < 0) etiqueta = `<span class="badge b-vencida">passou</span>`;
      else if(mins <= 60) etiqueta = `<span class="badge b-vencida">em ${mins} min</span>`;
      else if(h.data===hoje0) etiqueta = `<span class="badge b-parcial">hoje</span>`;
    }
    if(h.naoCompareceu) etiqueta = `<span class="badge b-desistencia">não estava</span>`;
    if(h.concluido) etiqueta = `<span class="badge b-concluida">feito</span>`;
    if(h.remarcadoDe) etiqueta += ` <span class="badge b-peca" title="Remarcado de ${h.remarcadoDe}">remarcado</span>`;
    const pendente = !h.concluido && !h.naoCompareceu;
    return `<tr>
      <td><b>${fmtDH(h)}</b> ${etiqueta}${h.remarcadoDe?`<div style="font-size:11px;color:var(--muted)">antes: ${h.remarcadoDe}</div>`:''}</td>
      <td>${esc(h.cliente||'—')}${h.celular?`<div style="font-size:12px"><a href="https://wa.me/55${(h.celular||'').replace(/\D/g,'')}" target="_blank" style="color:#25d366;text-decoration:none">💬 ${esc(h.celular)}</a></div>`:''}</td>
      <td>${esc(h.servico||'—')}${h.endereco?`<div style="font-size:12px;color:var(--navy)">📍 ${esc(h.endereco)}</div>`:''}${h.obs?`<div style="font-size:12px;color:var(--muted)">${esc(h.obs)}</div>`:''}</td>
      <td class="right" style="white-space:nowrap">
        ${pendente?`<button class="btn amber sm" onclick="concluirHorario('${h.id}')">✔ Feito</button>
        <button class="btn sm" style="background:var(--purple)" onclick="remarcarHorario('${h.id}')">📅 Remarcar</button>
        <button class="btn warn sm" onclick="naoCompareceu('${h.id}')">🚫 Não estava</button>`:''}
        ${h.naoCompareceu?`<button class="btn sm" style="background:var(--purple)" onclick="remarcarHorario('${h.id}')">📅 Remarcar</button>`:''}
        <button class="btn sec sm" onclick="formHorario('${h.id}')">Editar</button>
        <button class="btn warn sm" onclick="delHorario('${h.id}')">Excluir</button>
      </td></tr>`;
  };
  return `
  <div class="card">
    <h2>📅 Próximos atendimentos (${proximos.length})</h2>
    <p class="hint" style="margin-bottom:8px">O sistema avisa 1 hora antes de cada horário.</p>
    ${proximos.length ? `<table><thead><tr><th>Data / Hora</th><th>Cliente</th><th>Serviço</th><th></th></tr></thead><tbody>
    ${proximos.map(linha).join('')}</tbody></table>` : '<div class="empty">Nenhum atendimento marcado. Clique em "+ Marcar horário".</div>'}
  </div>
  ${passados.length ? `<div class="card">
    <h2>Histórico (feitos e não comparecidos)</h2>
    <table><thead><tr><th>Data / Hora</th><th>Cliente</th><th>Serviço</th><th></th></tr></thead><tbody>
    ${passados.map(linha).join('')}</tbody></table>
  </div>` : ''}`;
}

async function confirmarRemarcacao(id){
  const h = (DB.horarios||[]).find(x=>x.id===id);

  const nd = f('rm-data'), nh = f('rm-hora');
  if(!nd || !nh) return alert('Informe a nova data e hora.');
  h.remarcadoDe = `${fdate(h.data)} às ${h.hora}`;

2 - Armazenamento após 7 dias: Após 7 dias da comunicação para retirada, será cobrada uma taxa diária de R$ 3,50 para conservação do equipamento, conforme previsto no contrato de depósito (Código Civil, Lei nº 10.406/2002, arts. 627 a 652).
3 - Descarte opcional: O cliente tem a opção de descartar o equipamento, bastando nos informar por e-mail.
4 - Comprovante de retirada: É necessário apresentar este comprovante para retirar o aparelho.
5 - Número da Ordem de Serviço: Ao entrar em contato conosco, por favor, informe o número da Ordem de Serviço para um atendimento mais eficiente.`;

function checklistItens(){ return (DB.config?.checklist && DB.config.checklist.length) ? DB.config.checklist : CHECKLIST_PADRAO; }
// Formata o Termo de Entrada destacando em VERMELHO o valor da taxa de orçamento não aprovado
function formatarTermosEntrada(txtRaw){
  const linhas = String(txtRaw||'').split('\n');
  return linhas.map(linha=>{
    const escLinha = esc(linha);
    // linha que fala de orçamento e tem um valor em R$ → destaca o valor em vermelho e negrito
    if(/or[çc]amento/i.test(linha) && /R\$/.test(linha)){
      return escLinha.replace(/(R\$\s?[\d.,]+)/g, '<b style="color:#c00000">$1</b>');
    }
    return escLinha;
  }).join('\n');
}
// Descobre o valor da taxa de orçamento/análise configurada no Termo de Entrada (ex.: "R$ 50,00").
// Usa o valor que o dono da loja já tem escrito lá; se não achar, usa R$ 50 como padrão.
function valorOrcamentoConfigurado(){
  const txt = (DB.config?.termos || TERMOS_PADRAO);
  const linhas = String(txt).split('\n');
  for(const linha of linhas){
    if(/or[çc]amento/i.test(linha) && /R\$/.test(linha)){
      const m = linha.match(/R\$\s?([\d.,]+)/);
      if(m){
        const v = Number(m[1].replace(/\./g,'').replace(',','.'));
        if(!isNaN(v) && v>0) return v;
      }
    }
  }
  return 50;
}

// Guarda o que está digitado nos campos da empresa em DB.config, sem exigir clicar em Salvar.
// Evita que adicionar/remover funcionário (que redesenha a tela) apague o que foi digitado.
function capturarConfigDaTela(){
  if(!document.getElementById('cf-nome')) return; // tela de config não está aberta
  DB.config = DB.config || {};
  const rua=f('cf-rua'), bairro=f('cf-bairro'), cidade=f('cf-cidade'), estado=f('cf-estado').toUpperCase();
  Object.assign(DB.config, {
    nomeEmpresa:f('cf-nome'), fantasia:f('cf-fantasia'),
    cnpj:f('cf-cnpj'), telefone:f('cf-tel'), telefone2:f('cf-tel2'),
    rua, bairro, cidade, estado,
    endereco:[rua, bairro].filter(Boolean).join(' - '), email:f('cf-email'),
    pixKey:f('cf-pixkey'), pixNome:f('cf-pixnome'), pixBanco:f('cf-pixbanco'), pixTipo:f('cf-pixtipo'),
    termos:document.getElementById('cf-termos')?.value.trim()||DB.config.termos||'',
    termosSaida:document.getElementById('cf-termos-saida')?.value.trim()||DB.config.termosSaida||'',
    checklist: (function(){
      const el = document.getElementById('cf-checklist');
      if(!el) return DB.config.checklist || [];
      const arr = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
      return arr.length ? arr : (DB.config.checklist||[]);
    })(),
    pixCidade: cidade.split(' - ')[0],
    taxas: (function(){
      if(!document.getElementById('tx-pix')) return DB.config.taxas || null;
      const credito = [];
      for(let i=1;i<=12;i++) credito.push(Number(document.getElementById('tx-cred-'+i)?.value)||0);
      return {
        pixDinheiro: Number(document.getElementById('tx-pix')?.value)||0,
        debito: Number(document.getElementById('tx-deb')?.value)||0,
        credito
      };
    })()
  });
}

function uploadLogo(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const file = inp.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = async () => {
        // redimensiona para no máximo 300px para não pesar no banco de dados
        const max = 300, escala = Math.min(1, max/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = img.width*escala; cv.height = img.height*escala;
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        DB.config = DB.config || {};
        DB.config.logo = cv.toDataURL('image/png');
        await save(); render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* ---- Geração do PIX (padrão BR Code / Banco Central) ---- */
function crc16(str){
  let crc = 0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for(let j=0;j<8;j++){ crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) : (crc<<1); crc &= 0xFFFF; }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
// Formata a chave no padrão exigido pelo Banco Central conforme o tipo
function normalizarChavePix(chave, tipo){
  const k = String(chave||'').trim();
  const digitos = k.replace(/\D/g,'');
  switch(tipo){
    case 'Celular': {
      let d = digitos;
      if(d.startsWith('55') && d.length>=12) d = d.slice(2); // remove 55 se veio junto
      return '+55' + d; // formato oficial: +55DDDNÚMERO
    }
    case 'CPF': return digitos.slice(0,11);
    case 'CNPJ': return digitos.slice(0,14);
    case 'E-mail': return k.toLowerCase();
    default: return k; // chave aleatória: exatamente como está
  }
}
function pixPayload(valor, cfg){
  const c = cfg || DB.config || {};
  if(!c.pixKey) return '';
  const chave = normalizarChavePix(c.pixKey, c.pixTipo || DB.config?.pixTipo || 'Celular');
  const emv = (id,v)=> id + String(v.length).padStart(2,'0') + v;
  const conta = emv('00','br.gov.bcb.pix') + emv('01', chave);
  let p = emv('00','01') + emv('26', conta) + emv('52','0000') + emv('53','986');
  if(valor && Number(valor)>0) p += emv('54', Number(valor).toFixed(2));
  p += emv('58','BR');
  p += emv('59', semAcento(c.pixNome||c.nomeEmpresa||'RECEBEDOR').slice(0,25).trim());
  p += emv('60', semAcento(c.pixCidade||'BRASIL').slice(0,15).trim());
  p += emv('62', emv('05','***'));
  p += '6304';
  return p + crc16(p);
}

    (i,j)=>(Math.floor(i/2)+Math.floor(j/3))%2===0,(i,j)=>(i*j)%2+(i*j)%3===0,
    (i,j)=>((i*j)%2+(i*j)%3)%2===0,(i,j)=>((i*j)%3+(i+j)%2)%2===0];

    for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]&&b[j])r[i+j]^=gexp(glog(a[i])+glog(b[j]));return r;}
